# StellarUrithi-Bidz Backend — Fly.io Configuration
# ============================================================================
# Deploy the Express.js backend (API + WebSocket + Indexer) to Fly.io.
#
# Quick start:
#   1. Install flyctl:  curl -L https://fly.io/install.sh | sh
#   2. Sign up / login: fly auth signup   (or fly auth login)
#   3. Create the app:  fly apps create stellar-urithi-bidz-backend
#   4. Set secrets:     fly secrets set CONTRACT_ID=... PINATA_JWT=...
#   5. Deploy:          fly deploy
#
# For details, see: https://fly.io/docs/

app = "stellar-urithi-bidz-backend"
primary_region = "iad"  # Ashburn, Virginia — change to nearest region

[build]
  dockerfile = "../Dockerfile.node"
  [build.args]
    APP_DIR = "/app/backend"

[env]
  PORT = "4000"
  NODE_ENV = "production"

  # PostgreSQL — provisioned via `fly postgres create` or external provider
  POSTGRES_HOST = "stellar-urithi-bidz-db.internal"
  POSTGRES_PORT = "5432"
  POSTGRES_DB = "stellar_urithi_bidz"
  POSTGRES_SSL = "true"

  # Stellar
  STELLAR_RPC_URL = "https://soroban-testnet.stellar.org"

  # CORS — set to your Vercel frontend URL(s) after deployment
  FRONTEND_URL = "https://stellar-urithi-bidz.vercel.app"

  # Indexer
  POLL_INTERVAL_MS = "5000"
  EVENT_BATCH_SIZE = "100"
  INDEXER_MAX_RETRIES = "3"

  # Logging
  LOG_LEVEL = "info"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false   # keep running for WebSocket + polling
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
