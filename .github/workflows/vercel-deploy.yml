# StellarUrithi-Bidz — Deploy to Vercel
# ============================================================================
# Deploys both the frontend and custodian-portal Next.js apps to Vercel.
#
# Prerequisites (one-time setup):
#   1. Create two Vercel projects at https://vercel.com/new:
#      - stellar-urithi-bidz       (Root Directory: frontend)
#      - stellar-urithi-bidz-custodian (Root Directory: custodian-portal)
#   2. Get your Vercel token: https://vercel.com/account/tokens
#   3. Add these GitHub secrets (Settings → Secrets and variables → Actions):
#      - VERCEL_TOKEN           — your Vercel API token
#      - VERCEL_ORG_ID          — from .vercel/project.json or `vercel link`
#      - VERCEL_PROJECT_ID      — from .vercel/project.json or `vercel link`
#   4. Set environment variables in the Vercel dashboard (see .env.example)

name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'custodian-portal/**'
      - '.github/workflows/vercel-deploy.yml'
  workflow_dispatch:  # allow manual trigger

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Deploy Frontend (Main Auction UI) ─────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
      url: https://stellar-urithi-bidz.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Vercel Token
        id: check_token
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::warning::VERCEL_TOKEN is not configured in repository secrets. Skipping Vercel deployment."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check_token.outputs.has_token == 'true'
        working-directory: frontend
        run: npm ci

      - name: Pull Vercel Environment
        if: steps.check_token.outputs.has_token == 'true'
        working-directory: frontend
        run: |
          npx vercel pull --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build on Vercel
        if: steps.check_token.outputs.has_token == 'true'
        working-directory: frontend
        run: |
          npx vercel build --prod \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Production)
        if: steps.check_token.outputs.has_token == 'true'
        working-directory: frontend
        run: |
          npx vercel deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            > deployment-url.txt
          echo "Frontend deployed: $(cat deployment-url.txt)"

  # ── Deploy Custodian Portal ───────────────────────────────────────────────────
  deploy-custodian:
    name: Deploy Custodian Portal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
      url: https://stellar-urithi-bidz-custodian.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Vercel Token
        id: check_token
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::warning::VERCEL_TOKEN is not configured in repository secrets. Skipping Vercel deployment."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: custodian-portal/package-lock.json

      - name: Install dependencies
        if: steps.check_token.outputs.has_token == 'true'
        working-directory: custodian-portal
        run: npm ci

      - name: Pull Vercel Environment
        if: steps.check_token.outputs.has_token == 'true'
        working-directory: custodian-portal
        run: |
          npx vercel pull --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build on Vercel
        if: steps.check_token.outputs.has_token == 'true'
        working-directory: custodian-portal
        run: |
          npx vercel build --prod \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Production)
        if: steps.check_token.outputs.has_token == 'true'
        working-directory: custodian-portal
        run: |
          npx vercel deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            > deployment-url.txt
          echo "Custodian Portal deployed: $(cat deployment-url.txt)"
