name: Contracts — Build & Test

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-build-and-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-build-and-test.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (Soroban)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: contracts/target
          key: ${{ runner.os }}-target-${{ hashFiles('contracts/**/Cargo.toml', 'contracts/**/*.rs') }}
          restore-keys: ${{ runner.os }}-target-

      - name: Check formatting
        working-directory: contracts
        run: cargo fmt --all -- --check

      - name: Clippy lint
        working-directory: contracts
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Run tests
        working-directory: contracts
        run: cargo test --verbose

      - name: Build release
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Verify WASM artifact
        run: |
          WASM="contracts/target/wasm32-unknown-unknown/release/stellar_urithi_auction.wasm"
          if [ -f "$WASM" ]; then
            echo "✅ WASM built: $(ls -lh "$WASM" | awk '{print $5}')"
          else
            echo "❌ WASM not found at $WASM"
            exit 1
          fi
