name: Frontend — Build & Typecheck

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit

  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_CONTRACT_ID: CD_TEST_PLACEHOLDER
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_WS_URL: http://localhost:4000
          NEXT_PUBLIC_PINATA_GATEWAY: https://gateway.pinata.cloud

  custodian-build:
    name: Custodian Portal Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: custodian-portal/package-lock.json

      - name: Install dependencies
        working-directory: custodian-portal
        run: npm ci

      - name: TypeScript type-check
        working-directory: custodian-portal
        run: npx tsc --noEmit

      - name: Build Next.js
        working-directory: custodian-portal
        run: npm run build
        env:
          NEXT_PUBLIC_CONTRACT_ID: CD_TEST_PLACEHOLDER
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_PINATA_GATEWAY: https://gateway.pinata.cloud
