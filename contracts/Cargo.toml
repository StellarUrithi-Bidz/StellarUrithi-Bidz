[workspace]
members = [
    "auction",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["StellarUrithi-Bidz Contributors"]
license = "MIT"
repository = "https://github.com/StellarUrithi-Bidz/StellarUrithi-Bidz"
description = "On-chain auction protocol for African art and cultural artifacts"

[workspace.dependencies]
soroban-sdk = "22.0.0"

[profile.release]
opt-level = "z"
lto = true
strip = "symbols"
codegen-units = 1
